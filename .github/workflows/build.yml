name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -q .github/workflows/TuanTuan.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5
      - name: Build
        run: cd TuanTuan && gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: tuantuan-apk
          path: TuanTuan/app/build/outputs/apk/debug/app-debug.apk
